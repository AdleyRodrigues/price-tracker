<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09281e" />
      <stop offset="1" stop-color="#04140e" />
    </linearGradient>
    <linearGradient id="pulse" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981" />
      <stop offset="0.5" stop-color="#34d399" />
      <stop offset="1" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="glow" x="4" y="10" width="56" height="44" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Grid Glow Lines -->
  <path d="M8 32H56" stroke="#10b981" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2 3" />
  <path d="M32 8V56" stroke="#10b981" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Pulse Line (Price Heartbeat) -->
  <path
    d="M10 32H20L25 21L33 45L41 17L47 36L50 32H54"
    stroke="url(#pulse)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Active Marker Dot -->
  <circle cx="50" cy="32" r="3" fill="#6ee7b7" />
</svg>
